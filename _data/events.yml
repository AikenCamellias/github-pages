  description: '<br>November Program: Year round gardening with Theaceae <br> <br>Thursday,
    November 12th, 2026 from 6:30 PM - 7:30 PM <br>Stevenson McClelland Building,
    St. Thaddeus Episcopal Church <br><a href="https://www.google.com/maps/place/129+Pendleton+St+SW,+Aiken,+SC+29801/@33.561355,-81.724648,793m/data=!3m2!1e3!4b1!4m6!3m5!1s0x88f84d062d7c30eb:0x239d6633569e1a7b!8m2!3d33.561355!4d-81.724648!16s%2Fg%2F11c1h00qhb?entry=ttu&g_ep=EgoyMDI2MDkyNy4xIKXMDSoASAFQAw%3D%3D">129
    Pendleton St SW</a> <br>Aiken SC 29801<p>Camellias belong to the family Theaceae.
    In addition to traditional Camellias, Theaceae includes many different flowering
    shrubs. Jonas Meyer, the plant curator of Woodlanders, will introduce these plants
    and show us how to have flowers blooming year round!</p><p>Jonas will also bring
    plants from his presentation to sell at the meeting including:</p><p>Gordonia
    lasianthus <br>Gordlinia ‘Sweet Tea’<br>Camellia japonica (single) <br>Camellia
    saluenensis ‘Appleblossom’<br>Camellia ‘Crimson Candles’ <br>Camellia ‘Jury’s
    Yellow’<br>Camellia ‘California Dawn’<br>Camellia edithae <br>Camellia sasanqua
    ‘Leslie Ann’<br>Camellia sinensis rosea <br>Camellia japonica ‘Kujaku Tsubaki’<br>Camellia
    oleifera</p><p>Additionally online orders placed with Woodlanders can be picked
    up at our November meeting, remember to specify this when checking out on their
    website.</p><p><br>A raffle will be held at the meeting for a "Star Above Star",
    "Gay Baby", and additional camellias for you to add to your garden.</p><p><br>See
    the meeting agenda <a href="https://docs.proton.me/doc?mode=open-url&token=D42878MP5M&linkId=KHb7sTj0fxw4kXUMS_V6Ma8CJApq1hkLGM7AhV2ZmwJBXTGW-IhZGtUR1wBHZP33i_3u8GquD8TYnNxGDU95gQ%3D%3D#tE2OCbdYMGqx"
    target="_blank">here</a></p>'
